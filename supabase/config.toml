# Configurazione Supabase CLI (sviluppo locale). Le chiavi mancanti usano i default della CLI.
project_id = "caption"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
major_version = 17

[studio]
port = 54323

[auth]
enabled = true
site_url = "caption://"
additional_redirect_urls = ["caption://auth-callback", "exp://127.0.0.1:8081/--/auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Login con codice OTP a 6 cifre (niente password).
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.generate-captions]
verify_jwt = true

[functions.sync-subscription]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# RevenueCat non invia un JWT Supabase: autenticazione con segreto condiviso.
[functions.revenuecat-webhook]
verify_jwt = false
