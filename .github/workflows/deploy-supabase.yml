name: Deploy Supabase

# Pubblica migrazioni del database ed Edge Functions sul progetto Supabase.
# Parte da sola a ogni push su main che tocca supabase/, oppure a mano da Actions → Run workflow.
# Secrets richiesti (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token personale (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_ID    ID del progetto (sigla nell'URL della dashboard)
#   SUPABASE_DB_PASSWORD   password del database scelta alla creazione del progetto

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-supabase.yml"]

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Controlla i secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Manca il secret $v"; exit 1; fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Collega il progetto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Impostazioni Auth versionate nel repo (Site URL, redirect consentiti, OTP).
      - name: Configurazione Auth
        run: |
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @supabase/auth/config.json > /dev/null
          echo "Auth config aggiornata"

      # Sul piano gratuito i template email si possono cambiare solo con SMTP personalizzato:
      # se Supabase rifiuta, il deploy prosegue e restano i template predefiniti (link).
      - name: Template email
        continue-on-error: true
        run: |
          code=$(curl -sS -o /tmp/tpl.out -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @supabase/auth/templates.json)
          echo "HTTP $code"; head -c 400 /tmp/tpl.out; echo
          [ "$code" -lt 300 ]

      - name: Migrazioni database
        run: supabase db push --linked

      - name: Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Riepilogo
        run: |
          echo "### Deploy completato" >> "$GITHUB_STEP_SUMMARY"
          supabase migration list --linked >> "$GITHUB_STEP_SUMMARY" || true
